{% extends "base.html" %}
{% block title %}Reset hasła – Finanse{% endblock %}
{% block content %}
<h1>Reset hasła</h1>
<form method="post" class="card narrow stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nazwa użytkownika
    <input name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" required autofocus>
  </label>
  <label>Kod odzyskiwania
    <input name="code" autocomplete="off" required>
  </label>
  <label>Nowe hasło
    <input type="password" name="password" minlength="8" autocomplete="new-password" required>
  </label>
  <button type="submit">Ustaw nowe hasło</button>
  <p class="muted hint">Nie masz kodu? Właściciel serwera może ustawić hasło poleceniem <code>flask --app finanse reset-password NAZWA</code>.</p>
</form>
{% endblock %}

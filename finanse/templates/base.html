<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finanse{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Finanse</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('wallets.index') }}">Portfele</a>
        <a href="{{ url_for('reports.index') }}">Raporty</a>
        <a href="{{ url_for('categories.index') }}">Kategorie</a>
        <a href="{{ url_for('auth.account') }}">Konto</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="link" type="submit">Wyloguj ({{ g.user.username }})</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Logowanie</a>
        <a href="{{ url_for('auth.register') }}">Rejestracja</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="alert">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

{% extends "base.html" %}
{% block title %}{{ title }} – Finanse{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card narrow stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nazwa użytkownika
    <input name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" required autofocus>
  </label>
  <label>Hasło
    <input type="password" name="password" required
           {% if new_password %}minlength="8" autocomplete="new-password"{% else %}autocomplete="current-password"{% endif %}>
  </label>
  <button type="submit">{{ submit }}</button>
  {% if not new_password %}
    <a href="{{ url_for('auth.reset_password') }}">Nie pamiętasz hasła?</a>
  {% endif %}
</form>
{% endblock %}

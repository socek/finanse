{% extends "base.html" %}
{% block title %}{{ title }} – Finanse{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card narrow stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nazwa
    <input name="name" value="{{ values.name }}" maxlength="100" required autofocus>
  </label>
  <label>Waluta
    <input name="currency" value="{{ values.currency }}" maxlength="3" pattern="[A-Za-z]{3}" required>
  </label>
  <label>Saldo początkowe
    <input name="initial_balance" value="{{ values.initial_balance }}" inputmode="decimal">
  </label>
  <div class="actions">
    <button type="submit">Zapisz</button>
    <a href="{{ url_for('wallets.detail', wallet_id=wallet.id) if wallet else url_for('wallets.index') }}">Anuluj</a>
  </div>
</form>
{% endblock %}
